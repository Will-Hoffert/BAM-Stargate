<h2 mat-dialog-title>{{ data.title }}</h2>
<form [formRoot]="person">
  <mat-dialog-content>
    <mat-form-field class="name" appearance="outline">
      <mat-label>Name</mat-label>
      <!-- Someone else's name, so the browser shouldn't offer the user's own. Selected on focus,
           so a rename can type straight over the current name. -->
      <input
        matInput
        #nameInput
        [formField]="person.name"
        autocomplete="off"
        (focus)="nameInput.select()"
      />
      <mat-hint align="end"
        >{{ person.name().value().trim().length }} / {{ maxNameLength }}</mat-hint
      >
      @for (error of person.name().errors(); track error.kind) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>
    @if (problem(); as problem) {
      <p role="alert">{{ problem }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancel()">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="person().submitting()">Save</button>
  </mat-dialog-actions>
</form>
